<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מרכז רגש</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#cc1f5f;--pink-2:#e24a85;--green:#97bf2e;--green-2:#b2d24a;--teal:#16a7c2;--teal-2:#45c3da;--ink:#2a2140;}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000;font-family:'Heebo',sans-serif}
#screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);container-type:size;overflow:hidden;background:#fff}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7cqw 8cqw 12cqh;opacity:0;transition:opacity 1s ease;overflow:hidden}
.slide.active{opacity:1;z-index:2}
.theme-pink{background:radial-gradient(120% 120% at 80% 0%,var(--pink-2),var(--pink));color:#fff}
.theme-green{background:radial-gradient(120% 120% at 80% 0%,var(--green-2),var(--green));color:#fff}
.theme-teal{background:radial-gradient(120% 120% at 80% 0%,var(--teal-2),var(--teal));color:#fff}
.theme-light{background:#fff;color:var(--ink)}.theme-light .title{color:var(--pink)}.theme-light .eyebrow{color:var(--teal)}.theme-light .cta{background:var(--pink);color:#fff}
.eyebrow{font-family:'Fredoka';font-size:2.6cqw;font-weight:600;margin-bottom:2.2cqh;opacity:.95}
.title{font-family:'Fredoka','Heebo';font-size:6.2cqw;font-weight:700;line-height:1.1;margin-bottom:3cqh;max-width:92%;text-shadow:0 .4cqh 1.4cqh rgba(0,0,0,.12)}
.body{font-size:2.7cqw;line-height:1.45;max-width:80%;opacity:.97}
.cta{margin-top:5.5cqh;display:inline-flex;align-items:center;gap:1cqw;font-size:2.9cqw;font-weight:800;direction:ltr;background:#fff;color:var(--pink);padding:1.6cqh 4.5cqw;border-radius:999px;box-shadow:0 1.4cqh 4cqh rgba(0,0,0,.22)}
.theme-pink .cta{color:var(--pink)}.theme-green .cta{color:var(--green)}.theme-teal .cta{color:var(--teal)}
.slide .eyebrow,.slide .title,.slide .body,.slide .cta{opacity:0;transform:translateY(4cqh);transition:opacity .9s ease,transform .9s ease}
.slide.active .eyebrow{opacity:1;transform:none;transition-delay:.3s}.slide.active .title{opacity:.999;transform:none;transition-delay:.55s}
.slide.active .body{opacity:1;transform:none;transition-delay:.85s}.slide.active .cta{opacity:1;transform:none;transition-delay:1.15s}
.hearts{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.hearts svg{position:absolute;opacity:.16;animation:float linear infinite}
@keyframes float{0%{transform:translateY(8cqh) rotate(-8deg)}50%{transform:translateY(-6cqh) rotate(8deg)}100%{transform:translateY(8cqh) rotate(-8deg)}}
#logo{position:absolute;top:4cqh;left:3cqw;z-index:60;height:15cqh;background:rgba(255,255,255,.92);padding:1.4cqh 1.6cqw;border-radius:1.6cqh;filter:drop-shadow(0 .6cqh 1.8cqh rgba(0,0,0,.18))}
.cornerimg{position:absolute;width:30cqw;height:30cqw;bottom:-5cqw;right:-5cqw;border-radius:50%;object-fit:cover;border:.8cqw solid rgba(255,255,255,.92);box-shadow:0 1cqh 4cqh rgba(0,0,0,.28);z-index:3}
#progress{position:absolute;bottom:0;left:0;right:0;height:.7cqh;background:rgba(0,0,0,.08);z-index:50}#bar{height:100%;width:0;background:rgba(255,255,255,.9)}
.on-light #bar{background:var(--pink)}
#footer{position:absolute;bottom:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:flex-end;padding:1.8cqh 3cqw;color:#fff;font-weight:600;font-size:2cqw;background:linear-gradient(0deg,rgba(0,0,0,.18),transparent)}
.on-light #footer{color:var(--ink)}#clock{display:flex;align-items:center;gap:.7cqw;font-family:'Fredoka';font-variant-numeric:tabular-nums;opacity:.95}
</style></head><body>
<div id="screen"><div id="frame">

<div id="stage"></div><div id="progress"><div id="bar"></div></div>
<div id="footer"><div id="clock"><svg viewBox="0 0 24 24" width="1.05em" height="1.05em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-.18em"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path></svg><span class="t"></span></div></div>
</div></div>
<script>
const D={"tagline":"ילדים שאוהבים באמת","logo":"","def":9,"slides":[{"theme":"pink","eyebrow":"ברוכים הבאים למרכז רגש","title":"ילדים שאוהבים באמת","body":"מרכז התפתחות, טיפול וליווי למשפחות — כאן בשבילכם ובשביל הילדים.","cta":"","seconds":7},{"theme":"teal","eyebrow":"כדאי לדעת","title":"ייתכן ומגיע לכם כסף מהביטוח הלאומי","body":"הורים לילדים עם בעיות שפה, התנהגות או עיכוב התפתחותי עשויים להיות זכאים לקצבה מהביטוח הלאומי. מחלקת הזכויות שלנו כאן לרשותכם בטלפון ובוואטסאפ:","cta":"073-3797077","seconds":11},{"theme":"green","eyebrow":"מחלקת הזכויות של מרכז רגש","title":"לא יודעים אם אתם זכאים? נבדוק יחד","body":"בדיקת זכאות חינם, ליווי אישי בתהליך מול הביטוח הלאומי — בלי בירוקרטיה מסובכת.","cta":"073-3797077","seconds":9}]};
const ICONS={"none":"","phone":"<svg viewBox=\"0 0 24 24\" width=\"1em\" height=\"1em\" fill=\"currentColor\" style=\"vertical-align:-.12em\"><path d=\"M6.62 10.79c1.44 2.83 3.76 5.15 6.59 6.59l2.2-2.2c.28-.28.67-.36 1.02-.25 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 5c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z\"/></svg>","whatsapp":"<svg viewBox=\"0 0 24 24\" width=\"1em\" height=\"1em\" fill=\"currentColor\" style=\"vertical-align:-.12em\"><path d=\"M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.02c-.24.68-1.42 1.31-1.95 1.36-.5.05-1.13.07-1.82-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.79-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-2.99 0-1.42.75-2.12 1.01-2.41.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.58.82 2 .89 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.28-.12.56.16.28.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.21 1.36.28.14.44.12.6-.07.17-.19.69-.81.88-1.09.18-.28.37-.23.62-.14.25.09 1.6.76 1.87.9.28.14.46.21.53.32.07.12.07.66-.17 1.34z\"/></svg>","web":"<svg viewBox=\"0 0 24 24\" width=\"1em\" height=\"1em\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"vertical-align:-.12em\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18\"/></svg>","pin":"<svg viewBox=\"0 0 24 24\" width=\"1em\" height=\"1em\" fill=\"currentColor\" style=\"vertical-align:-.12em\"><path d=\"M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z\"/></svg>","mail":"<svg viewBox=\"0 0 24 24\" width=\"1em\" height=\"1em\" fill=\"currentColor\" style=\"vertical-align:-.12em\"><path d=\"M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z\"/></svg>","clock":"<svg viewBox=\"0 0 24 24\" width=\"1em\" height=\"1em\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" style=\"vertical-align:-.12em\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7.5V12l3 2\"/></svg>"};
const VERSION="1791967385019";
const THEMES=['pink','green','teal'];const stage=document.getElementById('stage'),bar=document.getElementById('bar');
function tick(){const n=new Date();document.querySelector('#clock .t').textContent=n.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}setInterval(tick,1000);tick();
function hearts(){const w=document.createElement('div');w.className='hearts';for(let k=0;k<6;k++){const s=2+(k%3)*1.6;const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('width',(s*1.2)+'cqw');svg.setAttribute('height',(s*1.2)+'cqw');const p=document.createElementNS(ns,'path');p.setAttribute('d','M12 21s-7.5-4.7-10-9.3C.3 8.4 2 5 5.2 5c2 0 3.2 1.1 3.8 2 .6-.9 1.8-2 3.8-2C16 5 17.7 8.4 16 11.7 13.5 16.3 12 21 12 21z');p.setAttribute('fill','#fff');svg.appendChild(p);svg.style.top=(8+(k*14)%80)+'%';svg.style.left=((k*23)%88)+'%';svg.style.animationDuration=(9+k*2)+'s';svg.style.animationDelay=(-k*1.7)+'s';w.appendChild(svg);}return w;}
const els=D.slides.map((s,i)=>{const d=document.createElement('div');const t=s.theme||THEMES[i%3];d.className='slide theme-'+t;d.dataset.theme=t;d.appendChild(hearts());
const x=document.createElement('div');x.innerHTML=(s.img?'<img class=cornerimg src="'+s.img+'">':'')+(s.eyebrow?'<div class=eyebrow>'+s.eyebrow+'</div>':'')+(s.title?'<div class=title>'+s.title+'</div>':'')+(s.body?'<div class=body>'+s.body+'</div>':'')+(s.cta?'<div class=cta>'+(ICONS[s.icon||'phone']||'')+'<span>'+s.cta+'</span></div>':'');
Array.from(x.children).forEach(c=>d.appendChild(c));stage.appendChild(d);return d;});
let idx=-1;function show(i){els.forEach(e=>e.classList.remove('active'));const el=els[i];el.classList.add('active');document.getElementById('screen').classList.toggle('on-light',el.dataset.theme==='light');const sec=(D.slides[i].seconds||D.def);bar.style.transition='none';bar.style.width='0%';void bar.offsetWidth;bar.style.transition='width '+sec+'s linear';bar.style.width='100%';clearTimeout(window.__t);window.__t=setTimeout(next,sec*1000);}
function next(){if(window._pending){location.reload();return;}idx=(idx+1)%els.length;show(idx);}next();
// בדיקת גרסה חדשה כל דקה — אם פורסם עדכון, ירוענן לבד במעבר השקף הבא
window._pending=false;
setInterval(function(){fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.v&&String(j.v)!==VERSION)window._pending=true;}).catch(function(){});},60000);
document.body.addEventListener('click',()=>{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});});
</script></body></html>
